[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/story/branches"
  to = "/.netlify/functions/branches"
  status = 200

[[redirects]]
  from = "/api/story/continue"
  to = "/.netlify/functions/continue"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
